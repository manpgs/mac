<h1 class="Sh" id="NAME"><a class="permalink" href="#NAME">NAME</a></h1>
<p class="Pp"><code class="Nm">previewsd</code> &#x2014; <span class="Nd">Xcode
    Previews daemon</span></p>
</section>
<section class="Sh">
<h1 class="Sh" id="DESCRIPTION"><a class="permalink" href="#DESCRIPTION">DESCRIPTION</a></h1>
<p class="Pp"><code class="Nm">previewsd</code> is the daemon for Xcode
    Previews.</p>
<p class="Pp">There are no configuration options to
    <code class="Nm">previewsd</code>, and users should not run
    <code class="Nm">previewsd</code> manually.</p>
</section>
